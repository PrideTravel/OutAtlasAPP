<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>OutAtlas — Travel Safe</title>
  <meta name="description" content="The LGBTQ travel guide. Scroll to fly through a world where you're celebrated, not just tolerated." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>🗺️</text></svg>" />
  <style>
    /* OutAtlas brand tokens for the scroll-world engine.
       --sw-bg must match the dominant dark tone of the neon night scenes. */
    :root, .sw-root {
      --sw-bg: #090f0d;
      --sw-ink: #f0f8f4;
      --sw-ink-soft: #7ab8a0;
      --sw-accent: #38bd99;
      --sw-font-display: 'SF Pro Display', ui-rounded, 'Segoe UI', system-ui, sans-serif;
      --sw-font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
    }
    html, body { margin: 0; background: #090f0d; }
    /* Brand mark: OutAtlas teal gradient */
    .sw-brand__mark {
      background: linear-gradient(145deg, #38bd99 0%, #0d7d63 100%) !important;
      box-shadow: 0 6px 14px rgba(56, 189, 153, 0.35) !important;
    }
    /* Top CTA button: teal instead of near-black */
    .sw-topcta {
      background: #38bd99 !important;
      color: #090f0d !important;
    }
    /* Primary CTA button */
    .sw-btn--primary {
      background: #38bd99 !important;
      color: #090f0d !important;
    }
  </style>
</head>
<body>
  <div id="top"></div>
  <div id="world"></div>

  <script src="scrub-engine.js"></script>
